org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# org.gradle.daemon=false（注释掉，daemon 保持运行避免客户端断开取消）
# 守护进程空闲超时：延长到 1 小时（默认 3 分钟），避免长构建中途被回收
org.gradle.daemon.idletimeout=3600000
org.gradle.workers.max=2
# 并行构建：开启多项目并行编译
org.gradle.parallel=true
# 显式关闭构建缓存（可选）
org.gradle.caching=false
# 限制 Kotlin 编译 daemon 内存，避免与 Gradle 叠加触发 OOM
kotlin.daemon.jvmargs=-Xmx768M
android.useAndroidX=true
# 关闭 Jetifier：Flutter 项目使用 AndroidX，无需转换旧 support 库，
# 也避免 JetifyTransform 处理 Flutter 引擎 jar 时触发 Java heap space
android.enableJetifier=false
# 沙箱代理：已禁用（沙箱环境无代理服务，走国内镜像直接下载）
# systemProp.http.proxyHost=127.0.0.1
# systemProp.http.proxyPort=18080
# systemProp.https.proxyHost=127.0.0.1
# systemProp.https.proxyPort=18080
# systemProp.http.nonProxyHosts=localhost|127.0.0.1
# systemProp.https.nonProxyHosts=localhost|127.0.0.1
# 下载超时：避免代理连接挂起导致构建卡死（失败后 Gradle 会自动重试）
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=30000
systemProp.org.gradle.internal.http.connectionRequestTimeout=30000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
