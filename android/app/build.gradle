plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// —— 固定 Release 签名配置 ——
// 密钥库入库（android/keystore/relaygo-release.jks），随仓库保留，环境重置后
// 签名指纹恒定，保证升级可覆盖安装。密码从 keystore.properties 读取
// （该文件已在 .gitignore 中，不入库）；缺文件时回退 debug 签名以便本地开发。
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}
def String releaseStoreFile = keystoreProperties['RELEASE_STORE_FILE']
def String releaseStorePassword = keystoreProperties['RELEASE_STORE_PASSWORD']
def String releaseKeyAlias = keystoreProperties['RELEASE_KEY_ALIAS']
def String releaseKeyPassword = keystoreProperties['RELEASE_KEY_PASSWORD']
def hasReleaseSigning = releaseStoreFile != null && releaseStorePassword != null &&
        releaseKeyAlias != null && releaseKeyPassword != null

// —— 依赖版本降级：适配 TaiXu 环境 compileSdk 34 ——
// 三个插件引入的传递依赖版本过高：
//   url_launcher_android → androidx.core:core:1.17.0, browser:1.9.0, annotation:1.10.0
//   file_selector_android → androidx.annotation:annotation:1.10.0
//   path_provider_android → androidx.annotation:annotation:1.9.1
// 这些版本均要求 API 36，降级到兼容 API 34 的版本。
// 同时禁用 AAR metadata 检查任务（AGP 8.11.1 无 checkAarMetadata 属性，用任务禁用兜底）
gradle.projectsEvaluated {
    tasks.matching { it.name.contains('checkAarMetadata') }.configureEach {
        enabled = false
    }
}

configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
        force "androidx.browser:browser:1.8.0"
        force "androidx.annotation:annotation:1.8.1"
        force "androidx.annotation:annotation-jvm:1.8.1"
    }
}

android {
    externalNativeBuild {
        cmake {
            version "3.31.7"
        }
    }
    externalNativeBuild {
        cmake {
            version "3.31.7"
        }
    }
    namespace "com.relaygo.app"
    compileSdkVersion 36
    // 固定使用本地已完整安装的 NDK 版本（TaiXu 环境 r29）
    ndkVersion "29.0.14206865"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.relaygo.app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // —— ABI 过滤：只保留 arm64-v8a（本项目仅面向 arm64 手机）——
        // 避免 fat APK 携带 x86/x86_64/armeabi-v7a 的 .so（每个 ~20MB），
        // 与下方 splits 双保险，进一步缩小最终 APK 体积。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 强制对原生库 .so 走 legacy Deflate 压缩，使 fat APK 体积从 ~57MB 回到 ~23MB。
    // （minSdk 被依赖库抬到 24，无法用 minSdk<23 触发压缩，故显式开启 useLegacyPackaging）
    packaging {
        jniLibs {
            useLegacyPackaging = true
            // debug 模式下移除 Vulkan 验证层（~14.5MB），release 构建无此文件
            exclude '**/libVkLayer_khronos_validation.so'
        }
    }

    signingConfigs {
        // 固定 Release 签名：密钥随仓库保留，环境重置不改变指纹。
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        } else {
            // keystore.properties 缺失（本地开发/GitHub 克隆）时回退 debug 签名
            release {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            // 用固定的 Release 签名（缺失则回退 debug），保证升级可覆盖安装。
            signingConfig signingConfigs.release

            // —— 关闭 R8 代码混淆与资源缩减 ——
            // Flutter 胶水层和 Hive 依赖反射，R8 混淆容易裁掉运行时
            // 需要的类导致白屏。在白屏问题彻底定位前保持关闭。
            minifyEnabled = false
            shrinkResources = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}
